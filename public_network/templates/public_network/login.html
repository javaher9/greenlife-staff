<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود شبکه Green Life</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#241145,#090d18 55%,#05070d);color:#fff;font-family:Tahoma,Arial;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,430px);background:#0f1626;border:1px solid rgba(168,85,247,.3);border-radius:24px;padding:26px;box-shadow:0 25px 70px #0008}h1{font-size:25px;margin:0 0 8px}.sub{color:#aeb9ca;line-height:1.8;margin-bottom:20px}.field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;font-weight:700}.field input{width:100%;background:#0a101c;border:1px solid #334155;color:#fff;border-radius:13px;padding:13px;font:inherit}.error{color:#fda4af;font-size:12px;margin-top:5px}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;font:700 15px Tahoma}.back{text-align:center;margin-top:14px}.back a{color:#c4b5fd;text-decoration:none}</style></head><body><div class="card"><h1>ورود به شبکه Green Life</h1><div class="sub">برای مدیریت لینک اختصاصی و اعضای شبکه خود وارد شوید.</div><form method="post">{% csrf_token %}{% if form.non_field_errors %}<div class="error">{{ form.non_field_errors }}</div>{% endif %}{% for field in form %}<div class="field"><label>{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="error">{{ e }}</div>{% endfor %}</div>{% endfor %}<button class="btn">ورود</button></form><div class="back"><a href="{% url 'public_network:signup' %}?src=direct">ساخت حساب جدید</a></div></div></body></html>
