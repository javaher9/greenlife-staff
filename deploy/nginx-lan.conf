server {
    listen 80;
    client_max_body_size 30M;

    # This listener is only for private LAN access. Even if the host port is
    # accidentally exposed, public source addresses are denied here.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.0/8;
    deny all;

    location /static/ { alias /app/staticfiles/; }
    location /media/ { alias /app/media/; }
    location / {
        proxy_pass http://web_lan:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LAN is HTTP-only. Strip Secure from all upstream cookies so browsers
        # can return the LAN session/CSRF cookies on private HTTP requests.
        # This file is used only by nginx_lan; public HTTPS cookies are untouched.
        proxy_cookie_flags ~ nosecure samesite=lax;
    }
}
