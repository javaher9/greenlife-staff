map $http_x_forwarded_proto $greenlife_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    client_max_body_size 30M;

    # Docker's embedded DNS always tracks the current container address.
    # Using a variable in proxy_pass forces nginx to resolve "web" at request
    # time instead of pinning the IP that existed when nginx first started.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $greenlife_web_upstream web:8005;

    location /static/ { alias /app/staticfiles/; }
    location /media/ { alias /app/media/; }
    location / {
        proxy_pass http://$greenlife_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host staff.greenlifeclinics.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $greenlife_forwarded_proto;
    }
}
