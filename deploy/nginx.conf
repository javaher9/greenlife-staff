map $http_x_forwarded_proto $greenlife_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    client_max_body_size 30M;
    location /static/ { alias /app/staticfiles/; }
    location /media/ { alias /app/media/; }
    location / {
        proxy_pass http://web:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve HTTPS from the outer reverse proxy. Overwriting this with
        # the inner nginx $scheme ("http") makes Django reject HTTPS login POSTs
        # during CSRF origin validation.
        proxy_set_header X-Forwarded-Proto $greenlife_forwarded_proto;
    }
}
