services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      # Explicit production origin fallback keeps CSRF login validation stable
      # even if an older .env does not yet contain this value.
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-https://staff.greenlifeclinics.com}"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8005"


  # Dedicated scheduler for reminders and delayed messages.
  # Reuses the approved production web image and shares its database.
  sms_worker:
    image: greenlife-staff-runtime-web:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
      - web
    entrypoint: ["python", "manage.py", "process_sms_queue", "--loop", "--interval", "30"]
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:1.31.3-alpine
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro

volumes:
  postgres_data:
  media_data:
  static_data:
