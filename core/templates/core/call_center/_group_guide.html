<style>
body.gl-page-call_center_dashboard .ccx .ccx-group-strip{gap:9px!important;flex-wrap:wrap!important}
body.gl-page-call_center_dashboard .ccx .ccx-group-pair{padding:3px;border:1px solid #d9e5e2;border-radius:13px;background:#f9fcfb;gap:3px}
body.gl-page-call_center_dashboard .ccx .ccx-group-pair .ccx-group-guide,
body.gl-page-call_center_dashboard .ccx .cc-work-row .lead-contact-control :is(select,button),
body.gl-page-call_center_dashboard .ccx .ccx-name-line [data-name-label]{background:#f7faf9!important;color:#344e50!important;-webkit-text-fill-color:#344e50!important;color-scheme:light;box-shadow:none!important}
body.gl-page-call_center_dashboard .ccx .ccx-group-pair button.ccx-group-guide{background:#f0eafa!important;color:#684995!important;min-width:30px!important;min-height:30px!important;padding:0!important;border:1px solid #ded3eb!important}
body.gl-page-call_center_dashboard .ccx .lead-contact-control{max-width:205px}
body.gl-page-call_center_dashboard .ccx .lead-contact-control [data-contact-edit] span{display:none}
body.gl-page-call_center_dashboard .ccx .lead-contact-control [data-contact-edit]{min-width:32px!important;height:32px!important}
#ccxGroupGuide{color-scheme:light;width:min(450px,90vw);box-sizing:border-box;margin:auto;padding:20px;background:white!important;color:#273e48!important;border:1px solid #d9e5e2;border-radius:16px;direction:rtl}
#ccxGroupGuide::backdrop{background:#20303b55}
#ccxGroupGuide p{white-space:pre-line;line-height:1.95;color:#344e50!important}
#ccxGroupGuide footer{display:flex;align-items:center;gap:12px}
#ccxGroupGuide button{background:#efe9f7!important;color:#553f71!important;border:0;border-radius:8px;padding:6px 14px}
@media(min-width:1000px){body.gl-page-call_center_dashboard .ccx .cc-work-row .ccx-actions{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:5px!important}body.gl-page-call_center_dashboard .ccx .cc-work-row .ccx-actions .ccx-action{min-height:34px!important;white-space:normal!important}}
</style>
<dialog id="ccxGroupGuide" aria-labelledby="ccxGuideName"><h3 id="ccxGuideName"></h3><p></p><footer><form method="dialog"><button>بستن</button></form>{% if can_manage_groups %}<a href="{% url 'call_center_group_create' %}">ویرایش راهنما</a>{% endif %}</footer></dialog>
<script>
(() => {
  const guide = document.getElementById('ccxGroupGuide');
  for (const button of document.querySelectorAll('[data-group-guide]')) {
    button.addEventListener('click', () => {
      guide.querySelector('h3').textContent = button.dataset.groupGuide;
      guide.querySelector('p').textContent = button.dataset.guidance || 'هنوز راهنمایی برای این گروه ثبت نشده است.';
      const edit = guide.querySelector('a');
      if (edit) edit.hash = 'guide-' + button.dataset.groupId;
      guide.showModal();
    });
  }
})();
</script>
