<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اسکن و آنالیز</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f7f8;color:#172b38;margin:0;padding:20px}main{max-width:750px;margin:auto;background:white;border:1px solid #d8e3e5;border-radius:18px;padding:25px}h1{font-size:24px}label{display:block;font-weight:bold;margin:16px 0 6px}input,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #b8c9d0;border-radius:9px;font:inherit;background:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}button{background:#17795a;color:white;border:0;border-radius:10px;padding:15px 28px;font:inherit;font-weight:bold;margin-top:25px;cursor:pointer}.note{color:#586c75;font-size:13px}.msg{padding:10px;background:#eef7ee;border-radius:8px}@media(max-width:550px){.grid{grid-template-columns:1fr}main{padding:16px}}</style></head><body><main><h1>اسکن و آنالیز بدن</h1><p class="note">شعبه: {{ branch.name|default:"مدیریت" }} | حساب ایستگاهی، بدون دسترسی به حضور و غیاب</p>{% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}<form method="post">{% csrf_token %}<label for="patient">مراجع</label><select name="patient_id" id="patient" required><option value="">انتخاب مراجع</option>{% for p in patients %}<option value="{{ p.pk }}">{{ p.full_name }} — {{ p.phone }}</option>{% endfor %}</select><label for="operator">انجام‌دهنده اسکن</label><select name="operator_id" id="operator" required><option value="">انتخاب پرسنل</option>{% for p in staff %}<option value="{{ p.pk }}" {% if default_staff.pk == p.pk %}selected{% endif %}>{{ p.user.get_full_name|default:p.user.username }}{% if p.role == 'receptionist' %} — منشی{% endif %}</option>{% endfor %}</select><div class="grid">{% for key,label in fields %}<div><label for="{{ key }}">{{ label }}</label><input id="{{ key }}" name="{{ key }}" type="number" min="0" step="0.01" inputmode="decimal" required></div>{% endfor %}</div><button type="submit">ثبت و تکمیل اسکن</button></form><p class="note">هر ثبت به‌عنوان جلسه مستقل در پرونده مراجع ذخیره می‌شود.</p></main></body></html>
