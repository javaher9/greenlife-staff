{% load static %}
<link rel="stylesheet" href="{% static 'core/agent-flow.css' %}">
<section id="gl-flow" dir="rtl" data-flow-view="overview" aria-labelledby="gl-flow-title">
  <header class="flow-heading">
    <div><h2 id="gl-flow-title">اطلس جریان گرین‌لایف</h2><p>از عضویت و درخواست ویزیت تا ورود لید و ارجاع</p></div>
    <div class="flow-controls"><span data-flow-mode>امروز · تهران</span><button type="button" data-flow-pause aria-pressed="false">توقف حرکت</button></div>
  </header>
  <nav class="flow-views" aria-label="انتخاب نمای اطلس">
    <button data-atlas-view="overview" type="button" aria-pressed="true">نمای کلی</button>
    <button data-atlas-view="sources" type="button" aria-pressed="false">آمار ورودی‌ها</button>
    <button data-atlas-view="members" type="button" aria-pressed="false">داخل گرین‌لایف ME</button>
    <button data-atlas-view="leads" type="button" aria-pressed="false">لیدهای فشرده</button>
  </nav>
  <div class="flow-map-tools" data-map-tools role="group" aria-label="اندازهٔ نقشه">
    <button type="button" data-expand aria-controls="gl-map-dialog" aria-expanded="false">نمای بزرگ</button>
    <button type="button" data-zoom="in" aria-label="بزرگ‌نمایی">＋</button>
    <button type="button" data-zoom="reset" aria-label="بازنشانی زوم">100٪</button>
    <button type="button" data-zoom="out" aria-label="کوچک‌نمایی">−</button>
  </div>
  <div class="flow-viewport" data-map-viewport><div class="flow-scene-stack">
  {% include 'core/agent_lead_journey.html' %}
  <ul class="flow-legend" aria-label="راهنمای شکل‌های اطلس">
    <li data-legend-group="member">
      <svg viewBox="0 0 26 35" width="26" height="35" aria-hidden="true" focusable="false">
        <path d="M21 2C19 7 23.2 12.4 21.5 20.8C20 28.3 15 33.1 10.5 32.5C4.7 31.7 3.2 25.7 4.9 19.8C6.1 14.7 10.1 13.1 13.1 10.6C15.4 8.6 18.6 3.7 21 2Z"/>
        <path class="flow-legend-liquid" d="M5 21.1Q13.1 23.2 21.5 20.3C20.3 27.6 15.3 33 10.6 32.4C5.9 31.7 3.5 27.2 5 21.1Z"/>
        <path class="flow-legend-shine" d="M7.4 17.8Q8.5 15.2 12.1 13.2"/>
        <circle class="flow-legend-bubble" cx="10" cy="25.4" r="1.1"/>
      </svg>
      عضویت و همگام‌سازی
    </li>
    <li data-legend-group="intake">
      <svg viewBox="0 0 26 35" width="26" height="35" aria-hidden="true" focusable="false">
        <path d="M13 1.8L22.6 10.6L21 25.8L13.6 32.9L5.5 26.1L3.6 11.2Z"/>
        <path class="flow-legend-liquid" d="M4.9 20.4Q13.1 21.9 21.6 20.3L21 25.8L13.6 32.9L5.5 26.1Z"/>
        <path class="flow-legend-facet" d="M13 2L9.4 11.3L10.6 25.8L13.6 32.6M22.6 10.6L17 12.2L15.8 26.2L13.6 32.6M3.6 11.2L9.4 11.3"/>
        <path class="flow-legend-shine" d="M6 10.9L11.5 5.9"/>
      </svg>
      منابع جذب لید
    </li>
    <li data-legend-group="service">
      <svg viewBox="0 0 26 35" width="26" height="35" aria-hidden="true" focusable="false">
        <path d="M7.4 3.4H18.6L22.2 7.3V28.5L19.3 31.8H6.8L3.8 28.5V7.3Z"/>
        <path class="flow-legend-liquid" d="M4 20.6Q12.9 22.1 22 20.6V28.5L19.2 31.6H6.9L4 28.5Z"/>
        <path class="flow-legend-facet" d="M4.2 7.3H21.8M7.7 7.3V28M18.7 28.4L21.3 25.8"/>
        <path class="flow-legend-shine" d="M8.4 4.9H17.7"/>
        <circle class="flow-legend-bubble" cx="15.3" cy="25.3" r="1.1"/>
      </svg>
      خدمات و نوبت
    </li>
    <li data-legend-group="followup">
      <svg viewBox="0 0 26 35" width="26" height="35" aria-hidden="true" focusable="false">
        <path d="M4.6 5.1C4.6 1.9 21.4 1.9 21.4 5.1V27.5C21.4 30.7 4.6 30.7 4.6 27.5Z"/>
        <path class="flow-legend-liquid" d="M4.9 19.1Q12.8 21.3 21.1 19.1V27.3C21.1 30.4 4.9 30.4 4.9 27.3Z"/>
        <ellipse class="flow-legend-facet" cx="13" cy="5.2" rx="8.4" ry="2.4"/>
        <path d="M3.2 29.6Q13 33.2 22.8 29.6V31.1Q13 34.6 3.2 31.1Z"/>
        <path class="flow-legend-shine" d="M7.3 9V16.6"/>
        <circle class="flow-legend-bubble" cx="12.4" cy="24.2" r="1.15"/>
      </svg>
      پیگیری لید
    </li>
  </ul>
  <div data-flow-map></div>
  </div></div>
  <footer class="flow-detail" aria-live="polite">
    <div><strong data-flow-title>لیدهای فشرده</strong><p data-flow-description></p></div>
    <span data-flow-count></span>
  </footer>
  <div class="flow-breakdown" data-flow-breakdown></div>
  <div class="flow-links"><a href="{% url 'me_members' %}">اعضای گرین‌لایف ME</a><a href="{% url 'lead_management_dashboard' %}">میز مدیریت لیدها</a></div>
</section>
<dialog id="gl-map-dialog" aria-label="نمای بزرگ اطلس جریان گرین‌لایف"></dialog>
<script src="{% static 'core/agent-map-zoom.js' %}" defer></script>
