{% extends 'core/base.html' %}{% block content %}
<style>
.im-new-wrap{max-width:820px;margin:0 auto 80px}.im-card{background:#fff;border:1px solid #e3e8ef;border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(35,45,66,.06);color:#1e2a3d}.im-card h1{margin:0 0 5px;font-size:23px}.im-card>p{margin:0 0 18px;color:#7b8798;font-size:11px}.im-form{display:grid;gap:13px}.im-form p{margin:0}.im-form label{display:block;margin-bottom:6px;font-size:11px;font-weight:900;color:#4e5b70}.im-form input,.im-form select,.im-form textarea{width:100%;box-sizing:border-box;border:1px solid #dce3ec;border-radius:11px;background:#fbfcfe;color:#17223a;padding:10px;font-family:inherit}.im-form select{min-height:220px}.im-form textarea{min-height:120px}.im-form .helptext{display:block;margin-top:5px;color:#8792a1;font-size:9px}.im-form .errorlist{list-style:none;padding:0;margin:5px 0 0;color:#b33751;font-size:10px}.im-actions{display:flex;gap:8px;margin-top:8px}.im-actions button,.im-actions a{padding:11px 14px;border-radius:10px;font-family:inherit;font-weight:900;font-size:11px;text-decoration:none}.im-actions button{border:0;background:#7553a8;color:#fff;cursor:pointer}.im-actions a{border:1px solid #dce3ec;color:#59667b;background:#fff}
</style>
<section class="im-new-wrap"><div class="im-card"><h1>گفتگوی جدید</h1><p>یک یا چند نفر از پرسنل را انتخاب کنید. فقط افراد همین گفتگو پیام‌ها را می‌بینند.</p><form method="post" class="im-form">{% csrf_token %}{{ form.as_p }}<div class="im-actions"><button type="submit">ایجاد و ارسال</button><a href="{% url 'internal_message_inbox' %}">انصراف</a></div></form></div></section>
{% endblock %}
