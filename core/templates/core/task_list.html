{% extends 'core/base.html' %}{% load jalali_tags %}{% block content %}<section class="panel"><div class="sectionhead"><h1>وظایف من</h1>{% if can_manage %}<a class="primary" href="/tasks/new/">تعریف وظیفه</a>{% endif %}</div>{% for t in tasks %}<a class="task" href="/tasks/{{ t.id }}/"><div><strong>{{ t.title }}</strong><small>{{ t.description|truncatechars:100 }}</small></div><span class="badge {{ t.status }}">{{ t.get_status_display }}</span></a>{% empty %}<p class="muted">وظیفه‌ای ندارید.</p>{% endfor %}</section>{% endblock %}
