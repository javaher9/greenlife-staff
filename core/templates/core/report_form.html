{% extends 'core/base.html' %}{% load jalali_tags staff_i18n %}
{% block content %}
<section class="panel reportbox">
  <h1>{% gl_t 'report.today' %}</h1>
  <p class="muted">{% gl_t 'report.intro' %}</p>

  <div class="recorder">
    <button type="button" id="record">🎙 {% gl_t 'report.start_record' %}</button>
    <span id="timer">00:00</span>
    <audio id="preview" controls hidden></audio>
    <p id="recordStatus" class="muted" style="margin-top:10px"></p>
  </div>

  <form method="post" enctype="multipart/form-data" id="reportForm">
    {% csrf_token %}
    <input type="hidden" name="submission_id" value="{{ submission_id }}">
    {{ form.as_p }}
    <label class="check"><input type="checkbox" name="process_ai" value="1"> {% gl_t 'report.ai' %}</label>
    <button class="primary" id="submitReport">{% gl_t 'report.submit' %}</button>
  </form>
</section>

<script>
(() => {
  const I18N = {
    secureRequired: "{% gl_t 'report.secure_required' %}",
    noCapture: "{% gl_t 'report.no_capture' %}",
    noMediaRecorder: "{% gl_t 'report.no_media_recorder' %}",
    askMic: "{% gl_t 'report.ask_mic' %}",
    recordAgain: "{% gl_t 'report.record_again' %}",
    emptyAudio: "{% gl_t 'report.empty_audio' %}",
    ready: "{% gl_t 'report.ready' %}",
    recordError: "{% gl_t 'report.record_error' %}",
    stop: "{% gl_t 'report.stop' %}",
    recording: "{% gl_t 'report.recording' %}",
    micDenied: "{% gl_t 'report.mic_denied' %}",
    micMissing: "{% gl_t 'report.mic_missing' %}",
    cannotStart: "{% gl_t 'report.cannot_start' %}",
    sending: "{% gl_t 'report.sending' %}",
    saving: "{% gl_t 'report.saving' %}",
    sendingAudio: "{% gl_t 'report.sending_audio' %}",
    submit: "{% gl_t 'report.submit' %}",
    audioFailed: "{% gl_t 'report.audio_failed' %}"
  };
  const btn = document.getElementById('record');
  const preview = document.getElementById('preview');
  const timer = document.getElementById('timer');
  const statusEl = document.getElementById('recordStatus');
  const form = document.getElementById('reportForm');
  const submitBtn = document.getElementById('submitReport');
  const fileInput = form.querySelector('input[type="file"]');

  if (fileInput) {
    fileInput.setAttribute('accept', 'audio/*,.webm,.m4a,.mp3,.wav,.ogg');
  }

  let recorder = null;
  let stream = null;
  let chunks = [];
  let recordedBlob = null;
  let recordedMime = '';
  let sec = 0;
  let interval = null;

  const setStatus = (text, isError=false) => {
    statusEl.textContent = text || '';
    statusEl.style.color = isError ? '#ff7b7b' : '';
  };

  const resetTimer = () => {
    sec = 0;
    timer.textContent = '00:00';
  };

  const stopTimer = () => {
    if (interval) clearInterval(interval);
    interval = null;
  };

  const pickMime = () => {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    const types = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      'audio/ogg;codecs=opus'
    ];
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  };

  const extensionFor = (mime) => {
    if (mime.includes('mp4')) return 'm4a';
    if (mime.includes('ogg')) return 'ogg';
    if (mime.includes('wav')) return 'wav';
    return 'webm';
  };

  const stopRecording = () => {
    if (recorder && recorder.state === 'recording') recorder.stop();
  };

  btn.addEventListener('click', async () => {
    if (recorder && recorder.state === 'recording') {
      stopRecording();
      return;
    }

    if (!window.isSecureContext) {
      setStatus(I18N.secureRequired, true);
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus(I18N.noCapture, true);
      if (fileInput) fileInput.click();
      return;
    }

    if (!window.MediaRecorder) {
      setStatus(I18N.noMediaRecorder, true);
      if (fileInput) fileInput.click();
      return;
    }

    try {
      setStatus(I18N.askMic);
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedMime = pickMime();
      recorder = recordedMime ? new MediaRecorder(stream, { mimeType: recordedMime }) : new MediaRecorder(stream);
      chunks = [];
      recordedBlob = null;

      recorder.addEventListener('dataavailable', e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      });

      recorder.addEventListener('stop', () => {
        stopTimer();
        btn.textContent = '🎙 ' + I18N.recordAgain;

        const mime = recorder.mimeType || recordedMime || 'audio/webm';
        recordedBlob = new Blob(chunks, { type: mime });

        if (!recordedBlob.size) {
          setStatus(I18N.emptyAudio, true);
          return;
        }

        preview.src = URL.createObjectURL(recordedBlob);
        preview.hidden = false;
        setStatus(I18N.ready);

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
      });

      recorder.addEventListener('error', e => {
        stopTimer();
        setStatus(I18N.recordError, true);
        console.error('MediaRecorder error:', e);
      });

      recorder.start(500);
      resetTimer();
      btn.textContent = '⏹ ' + I18N.stop;
      setStatus(I18N.recording);
      interval = setInterval(() => {
        sec += 1;
        timer.textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
        if (sec >= 120) stopRecording();
      }, 1000);
    } catch (err) {
      stopTimer();
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      console.error(err);
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
        setStatus(I18N.micDenied, true);
      } else if (err && err.name === 'NotFoundError') {
        setStatus(I18N.micMissing, true);
      } else {
        setStatus(I18N.cannotStart, true);
      }
    }
  });

  let submitting = false;

  form.addEventListener('submit', async (event) => {
    // Guard against double taps/clicks before the first request leaves the page.
    if (submitting) {
      event.preventDefault();
      return;
    }
    submitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = I18N.sending;

    if (!recordedBlob) {
      setStatus(I18N.saving);
      return; // normal browser POST; button remains locked
    }

    event.preventDefault();
    setStatus(I18N.sendingAudio);

    try {
      const data = new FormData(form);
      data.delete('audio');
      const mime = recordedBlob.type || 'audio/webm';
      const filename = `daily-report-${Date.now()}.${extensionFor(mime)}`;
      data.append('audio', recordedBlob, filename);

      const response = await fetch(form.action || window.location.href, {
        method: 'POST',
        body: data,
        credentials: 'same-origin',
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      window.location.href = response.url || '/reports/';
    } catch (err) {
      console.error(err);
      submitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = I18N.submit;
      setStatus(I18N.audioFailed, true);
    }
  });
})();
</script>
{% endblock %}
