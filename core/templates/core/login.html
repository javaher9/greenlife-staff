{% load static %}
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f31"><link rel="stylesheet" href="{% static 'core/app.css' %}?v=v38.1-login"><title>ورود | GreenLife Staff</title></head>
<body class="login-fixed-page"><main class="login-fixed-stage">
<picture class="login-fixed-art" aria-hidden="true"><source media="(max-width:700px)" srcset="{% static 'core/login/staff-login-mobile-full.webp' %}?v=v38.1"><img src="{% static 'core/login/staff-login-wide-full.webp' %}?v=v38.1" alt="" fetchpriority="high"></picture>
<form method="post" class="login-fixed-form" aria-label="ورود به سامانه پرسنل">{% csrf_token %}<h1 class="login-sr">GreenLife Staff</h1><label class="login-sr" for="{{ form.username.id_for_label }}">نام کاربری</label>{{ form.username }}<label class="login-sr" for="{{ form.password.id_for_label }}">گذرواژه</label>{{ form.password }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button type="submit" aria-label="ورود">ورود</button>{% if form.non_field_errors %}<div class="login-fixed-error" role="alert">نام کاربری یا گذرواژه صحیح نیست.</div>{% endif %}</form>
</main></body></html>
