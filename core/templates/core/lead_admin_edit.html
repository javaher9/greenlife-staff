{% extends 'core/base.html' %}{% block content %}<section style="max-width:680px;margin:30px auto;padding:24px;border:1px solid #334155;border-radius:18px;background:#111827;color:#fff" dir="rtl"><h1 style="margin-top:0">ویرایش لید</h1><p style="color:#cbd5e1">این صفحه فقط برای ادمین فعال است.</p><form method="post">{% csrf_token %}<label style="display:block;margin:16px 0 6px">نام</label><input name="full_name" value="{{ lead.full_name }}" required style="width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff"><label style="display:block;margin:16px 0 6px">موبایل</label><input name="phone" value="{{ lead.phone }}" required style="width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff"><div style="display:flex;gap:10px;margin-top:20px"><button type="submit" style="padding:10px 18px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-weight:800">ذخیره تغییرات</button><a href="{% url 'lead_management_dashboard' %}" style="padding:10px 18px;border-radius:10px;background:#1f2937;color:#fff;text-decoration:none">انصراف</a></div></form></section>{% endblock %}
