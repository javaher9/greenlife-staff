{% extends 'core/base.html' %}{% block content %}<div style="max-width:620px;margin:40px auto;padding:24px;border:1px solid #334155;border-radius:18px;background:#111827;color:#fff"><h2>ویرایش لید</h2><p style="color:#94a3b8">فقط ادمین</p><form method="post">{% csrf_token %}<label style="display:block;margin:16px 0 6px">نام</label><input name="full_name" value="{{ lead.full_name }}" required style="width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff"><label style="display:block;margin:16px 0 6px">شماره موبایل</label><input name="phone" value="{{ lead.phone }}" required style="width:100%;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff"><div style="display:flex;gap:10px;margin-top:22px"><button type="submit" style="padding:11px 20px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:800">ذخیره</button><a href="/lead-management/" style="padding:11px 20px;border-radius:10px;background:#334155;color:#fff;text-decoration:none">انصراف</a></div></form></div>{% endblock %}
