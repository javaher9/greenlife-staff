{% extends 'core/base.html' %}{% block content %}<div style="max-width:620px;margin:40px auto;padding:24px;border:1px solid #7f1d1d;border-radius:18px;background:#111827;color:#fff"><h2>حذف لید</h2><p>«{{ lead.full_name }}» با شماره {{ lead.phone }}</p><p style="color:#fca5a5">این کار قابل بازگشت نیست و فقط برای حذف لیدهای تستی/اشتباهی ادمین در نظر گرفته شده است.</p><form method="post">{% csrf_token %}<div style="display:flex;gap:10px;margin-top:22px"><button type="submit" style="padding:11px 20px;border:0;border-radius:10px;background:#dc2626;color:#fff;font-weight:800">تأیید حذف</button><a href="/lead-management/" style="padding:11px 20px;border-radius:10px;background:#334155;color:#fff;text-decoration:none">انصراف</a></div></form></div>{% endblock %}
