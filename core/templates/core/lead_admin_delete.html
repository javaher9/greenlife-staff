{% extends 'core/base.html' %}{% block content %}<section style="max-width:680px;margin:30px auto;padding:24px;border:1px solid #7f1d1d;border-radius:18px;background:#111827;color:#fff" dir="rtl"><h1 style="margin-top:0">حذف لید</h1><p>آیا از حذف <strong>{{ lead.full_name }}</strong> با شماره <strong>{{ lead.phone }}</strong> مطمئن هستید؟</p><p style="color:#fca5a5">حذف می‌تواند سوابق مرتبط این لید را نیز تحت تأثیر قرار دهد؛ فقط برای لیدهای تستی/اشتباهی استفاده شود.</p><form method="post">{% csrf_token %}<div style="display:flex;gap:10px;margin-top:20px"><button type="submit" style="padding:10px 18px;border:0;border-radius:10px;background:#dc2626;color:#fff;font-weight:800">بله، حذف شود</button><a href="{% url 'lead_management_dashboard' %}" style="padding:10px 18px;border-radius:10px;background:#1f2937;color:#fff;text-decoration:none">انصراف</a></div></form></section>{% endblock %}
