name: Verify Isfahan Role Usernames

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-isfahan-role-logins.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, greenlife-prod]
    timeout-minutes: 10
    steps:
      - name: Verify renamed users on production without displaying credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i greenlife-staff-runtime-web-1 python manage.py shell <<'PY'
          from django.contrib.auth.models import User
          from core.models import EmployeeProfile
          accounts=(
              ("esfahan.reception","Esfehan.monshi","receptionist"),
              ("esfahan.consultant","Esfehan.moshaver","consultant"),
          )
          for old,new,role in accounts:
              assert not User.objects.filter(username__iexact=old).exists(), f"Old login remains: {old}"
              users=list(User.objects.filter(username__iexact=new))
              assert len(users)==1, f"Missing or duplicate new login: {new}"
              user=users[0]
              profile=EmployeeProfile.objects.select_related("branch").get(user=user)
              assert user.username==new and user.is_active and profile.is_active and profile.role==role
              assert profile.branch and "اصفهان" in profile.branch.name
              print(f"{new}: username=ok role=ok branch=ok active=1 password_usable={user.has_usable_password()}")
          PY
      - name: Destroy unused one-time transfer private key
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          key_file="$HOME/.config/greenlife-staff/secure-credential-transfer/transfer-private.pem"
          if [ -f "$key_file" ]; then
            shred -u "$key_file" || rm -f "$key_file"
          fi
          echo "Temporary key cleanup complete."
