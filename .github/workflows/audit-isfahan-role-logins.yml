name: Audit Isfahan Role Logins

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-isfahan-role-logins.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, greenlife-prod]
    timeout-minutes: 10
    steps:
      - name: Inspect exact role accounts on live Django database (read only; no secrets)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i greenlife-staff-runtime-web-1 python manage.py shell -c '
          from django.contrib.auth.models import User
          from core.models import EmployeeProfile, StaffCredential
          expected = {
              "esfahan.reception": "receptionist",
              "esfahan.consultant": "consultant",
          }
          for username, role in expected.items():
              matches = list(User.objects.filter(username__iexact=username))
              if len(matches) != 1:
                  print(f"{username}: account_matches={len(matches)} (expected 1)")
                  continue
              user = matches[0]
              profile = EmployeeProfile.objects.select_related("branch").filter(user=user).first()
              credential = StaffCredential.objects.filter(user=user).first()
              branch = (profile.branch.name if profile and profile.branch else "")
              print(
                  f"{username}: exists=1 user_active={user.is_active} "
                  f"profile_active={getattr(profile, 'is_active', None)} "
                  f"role_ok={bool(profile and profile.role == role)} "
                  f"branch_isfahan={bool('اصفهان' in branch or 'esfahan' in branch.lower() or 'isfahan' in branch.lower())} "
                  f"desktop_password_usable={user.has_usable_password()} "
                  f"mobile_pin_configured={bool(credential and credential.mobile_pin_hash)} "
                  f"desktop_reveal_configured={bool(credential and credential.desktop_password_cipher)}"
              )
          '
