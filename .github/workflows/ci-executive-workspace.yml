name: Executive Workspace CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-only-strong-secret-key-for-greenlife-executive-workspace"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_HOST: "localhost"
      POSTGRES_DB: "greenlife"
      POSTGRES_USER: "greenlife"
      POSTGRES_PASSWORD: "greenlife"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q core greenlife
      - name: Django system check
        run: python manage.py check
      - name: Parse changed templates
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","greenlife.settings")
          import django
          django.setup()
          from django.template.loader import get_template
          for name in [
              "core/base.html",
              "core/task_list.html",
              "core/executive_workspace.html",
          ]:
              get_template(name)
              print("OK", name)
          PY
