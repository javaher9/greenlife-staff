name: Deploy GreenLife Staff

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: greenlife-staff-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Register the Ubuntu runner with these labels: self-hosted, linux, greenlife-prod
    runs-on: [self-hosted, linux, greenlife-prod]
    timeout-minutes: 30

    steps:
      - name: Safe production disk cleanup
        shell: bash
        run: |
          set -Eeuo pipefail

          FREE_KB=$(df -Pk / | awk 'NR==2 {print $4}')
          USED_PERCENT=$(df -Pk / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "Disk before cleanup: ${FREE_GB} GB free, ${USED_PERCENT}% used"

          # Only reclaim disposable caches/logs. Never prune Docker volumes or app data.
          if [ "$FREE_GB" -lt 20 ] || [ "$USED_PERCENT" -ge 82 ]; then
            echo "Low disk detected; reclaiming safe disposable space..."
            sudo journalctl --vacuum-size=200M || true
            sudo apt-get clean || true
            docker image prune -af || true
            docker builder prune -af || true
            find "$HOME/actions-runner/_diag" -type f -mtime +7 -delete 2>/dev/null || true
          fi

          df -h / || true
          docker system df || true

      - name: Production disk safety gate
        shell: bash
        run: |
          set -Eeuo pipefail

          # Never touch the live source if the server is close to running out of disk.
          # This protects the staff app from half-built Docker images / failed writes.
          MIN_FREE_GB=12
          MAX_USED_PERCENT=88

          FREE_KB=$(df -Pk / | awk 'NR==2 {print $4}')
          USED_PERCENT=$(df -Pk / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')
          FREE_GB=$((FREE_KB / 1024 / 1024))

          echo "Production disk: ${FREE_GB} GB free, ${USED_PERCENT}% used"

          if [ "$FREE_GB" -lt "$MIN_FREE_GB" ] || [ "$USED_PERCENT" -ge "$MAX_USED_PERCENT" ]; then
            echo "::error title=Production disk too full::Deploy stopped BEFORE changing production. Free space is ${FREE_GB} GB and disk usage is ${USED_PERCENT}%. Free disk space first, then rerun deployment."
            echo "Largest Docker usage (diagnostic only):"
            docker system df || true
            echo "Filesystem usage:"
            df -h / || true
            exit 1
          fi

          echo "Disk safety gate passed."

      - name: Checkout approved main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docker-compose.yml
          test -f scripts/deploy_runner.sh
          test -f scripts/harden_env.py
          python3 -m compileall -q core greenlife
          python3 -m py_compile scripts/harden_env.py
          bash -n entrypoint.sh scripts/*.sh

      - name: Sync source to fixed production directory
        shell: bash
        env:
          # Docker is installed as a confined Snap. This bind-mounted path is
          # the Snap-readable view of the canonical /opt/greenlife-staff tree.
          DEPLOY_PATH: /home/ubuntu/greenlife-staff-runtime
        run: |
          set -Eeuo pipefail
          test -d "$DEPLOY_PATH"
          test -f "$DEPLOY_PATH/.env"
          test -f "$DEPLOY_PATH/docker-compose.yml"
          mountpoint -q "$DEPLOY_PATH" || {
            echo "ERROR: $DEPLOY_PATH must be bind-mounted from /opt/greenlife-staff" >&2
            exit 1
          }
          mkdir -p "$DEPLOY_PATH/.rollback"

          # Preserve a source snapshot for quick code rollback. Secrets and runtime data are excluded.
          if [ -f "$DEPLOY_PATH/manage.py" ]; then
            tar \
              --exclude='.env' \
              --exclude='docker-compose.yml' \
              --exclude='backups' \
              --exclude='.rollback' \
              --exclude='media' \
              --exclude='staticfiles' \
              -czf "$DEPLOY_PATH/.rollback/source_previous.tar.gz" \
              -C "$DEPLOY_PATH" .
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='docker-compose.yml' \
            --exclude='backups/' \
            --exclude='.rollback/' \
            --exclude='media/' \
            --exclude='staticfiles/' \
            ./ "$DEPLOY_PATH/"

          chmod +x "$DEPLOY_PATH"/scripts/*.sh "$DEPLOY_PATH"/entrypoint.sh

      - name: Set public referral base URL
        shell: bash
        env:
          DEPLOY_PATH: /home/ubuntu/greenlife-staff-runtime
        run: |
          set -Eeuo pipefail
          if grep -q '^PUBLIC_BASE_URL=' "$DEPLOY_PATH/.env"; then
            sed -i 's#^PUBLIC_BASE_URL=.*#PUBLIC_BASE_URL=https://staff.greenlifeclinics.com#' "$DEPLOY_PATH/.env"
          else
            printf '\nPUBLIC_BASE_URL=https://staff.greenlifeclinics.com\n' >> "$DEPLOY_PATH/.env"
          fi

      - name: Deploy containers
        shell: bash
        env:
          DEPLOY_PATH: /home/ubuntu/greenlife-staff-runtime
        run: |
          set -Eeuo pipefail
          "$DEPLOY_PATH/scripts/deploy_runner.sh"

      - name: Roll back source if deployment fails
        if: failure()
        shell: bash
        env:
          DEPLOY_PATH: /home/ubuntu/greenlife-staff-runtime
        run: |
          set +e
          if [ -f "$DEPLOY_PATH/.rollback/source_previous.tar.gz" ]; then
            echo "Restoring previous source snapshot..."
            find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 \
              ! -name '.env' ! -name 'docker-compose.yml' \
              ! -name 'backups' ! -name '.rollback' \
              -exec rm -rf {} +
            tar -xzf "$DEPLOY_PATH/.rollback/source_previous.tar.gz" -C "$DEPLOY_PATH"
            chmod +x "$DEPLOY_PATH"/scripts/*.sh "$DEPLOY_PATH"/entrypoint.sh 2>/dev/null || true
            docker compose \
              --env-file "$DEPLOY_PATH/.env" \
              -f "$DEPLOY_PATH/docker-compose.yml" \
              --project-directory "$DEPLOY_PATH" \
              build
            docker compose \
              --env-file "$DEPLOY_PATH/.env" \
              -f "$DEPLOY_PATH/docker-compose.yml" \
              --project-directory "$DEPLOY_PATH" \
              up -d --remove-orphans
            cd "$DEPLOY_PATH"
            ./scripts/healthcheck.sh || true
          else
            echo "No previous source snapshot is available for code rollback."
          fi
          echo "NOTE: database migrations are not auto-reversed; use the pre-deploy DB backup if necessary."
