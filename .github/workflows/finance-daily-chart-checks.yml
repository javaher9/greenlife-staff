name: Finance Daily Chart Regression
on:
  pull_request:
    branches: [main]
    paths:
      - core/templatetags/finance_intelligence.py
      - core/templates/core/finance_dashboard.html
      - core/tests/test_finance_daily_revenue_curve.py
      - .github/workflows/finance-daily-chart-checks.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: greenlife
          POSTGRES_USER: greenlife
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U greenlife -d greenlife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: '1'
      SECRET_KEY: test-only-chart-regression-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: greenlife
      POSTGRES_USER: greenlife
      POSTGRES_PASSWORD: test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test core.tests.test_finance_daily_revenue_curve core.tests.test_finance_flower_matrix --verbosity 2
