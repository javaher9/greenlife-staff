name: Personnel Access Security Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/personnel-access-tests.yml'
      - 'core/views.py'
      - 'core/forms.py'
      - 'core/urls.py'
      - 'core/personnel_access.py'
      - 'core/templates/core/employee_list.html'
      - 'core/tests/test_personnel_access_controls.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personnel-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: greenlife.test_settings
      SECRET_KEY: greenlife-ci-personnel-access-strong-secret-key
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test personnel filtering, account revocation, role permissions, and existing credentials
        run: python manage.py test core.tests.test_personnel_access_controls core.tests.test_dual_credentials core.tests.test_personnel_quick_actions --noinput --verbosity 2
