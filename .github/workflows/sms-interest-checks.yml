name: SMS Interest Checks
on:
  push:
    branches: [codex/sms-choice]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test core.tests.test_sms_interest --verbosity 2
        env:
          DJANGO_SETTINGS_MODULE: greenlife.test_settings

