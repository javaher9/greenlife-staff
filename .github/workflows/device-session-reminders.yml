name: Device session reminders
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: greenlife-device-session-reminders
  cancel-in-progress: false

jobs:
  send-device-reminders:
    runs-on: [self-hosted, linux, greenlife-prod]
    timeout-minutes: 10
    steps:
      - name: Send tomorrow's device appointment reminders
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec greenlife-staff-runtime-web-1 python manage.py send_device_booking_reminders
