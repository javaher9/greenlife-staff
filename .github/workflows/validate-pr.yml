name: Validate GreenLife Staff PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  receptionist-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: greenlife
          POSTGRES_USER: greenlife
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenlife -d greenlife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "1"
      SECRET_KEY: "test-only-strong-secret-key-for-ci-receptionist-panel"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_DB: greenlife
      POSTGRES_USER: greenlife
      POSTGRES_PASSWORD: test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile changed application
        run: python -m compileall -q core greenlife
      - name: Production deployment shell syntax gate
        run: bash -n scripts/deploy_runner.sh
      - name: Django system check
        run: python manage.py check
      - name: Test corrected Keto-Fast first day and day plaques
        run: python manage.py test core.tests.test_diet_four_formats --verbosity 2
      - name: Check 13-day mint plaques and related diet formats
        run: python manage.py test core.tests.test_diet_four_formats --verbosity 2
      - name: Thirteen-day mobile preview focused regression
        run: python manage.py test core.tests.test_diet_four_formats --verbosity 2
      - name: Consultant narrow-screen light UI smoke test
        run: python manage.py test core.tests.test_consultant_mobile_style --verbosity 2
      - name: Phone staff chat light-theme smoke test
        run: python manage.py test core.tests.test_shared_chat_mobile_light --verbosity 2
      - name: Quality command center permissions and live source regression
        run: python manage.py test core.tests.test_quality_command_center --verbosity 2
      - name: Lead command CRM counting and privacy regression
        run: python manage.py test core.tests.test_lead_command_live --verbosity 2
      - name: SMS group audiences and permissions
        run: python manage.py test core.tests.test_bulk_sms_audiences --verbosity 2
      - name: Approved bulk SMS dispatch, opt-out and safety regression
        run: python manage.py test core.tests.test_bulk_sms_dispatch --verbosity 2
      - name: Device bank and treatment editing focused regression tests
        run: python manage.py test core.tests.test_unified_device_pricing core.tests.test_treatment_catalog_settings --verbosity 2
      - name: Legacy MHTML five-item content, media and doctor-preview regression
        run: python manage.py test core.tests.test_treatment_content_samples --verbosity 2
      - name: Diet preview notes, quotas and headphone regression
        run: python manage.py test core.tests.test_diet_preview_extras --verbosity 2
      - name: Weekly and Ramadan diet template regression tests
        run: python manage.py test core.tests.test_diet_two_templates core.tests.test_diet_daily --verbosity 2
      - name: Thirteen-day, text diet, new draft and CRM transfer regression
        run: python manage.py test core.tests.test_diet_four_formats core.tests.test_diet_two_templates core.tests.test_diet_daily --verbosity 2
      - name: Receptionist, call center, finance and lead-ingest regression tests
        run: python manage.py test core.tests.test_receptionist_role core.tests.test_doctor_dashboard core.tests.test_unified_device_pricing core.tests.test_treatment_catalog_settings core.tests.test_treatment_master_data core.tests.test_patient_360 core.tests.test_call_center_role core.tests.test_call_center_kpis core.tests.test_appointment_payment_visibility core.tests.test_telegram_lead core.tests.test_instagram_page_sources core.tests.test_consultant_finance core.tests.test_lead_ingest core.tests.test_unified_lead_routing core.tests.test_server_health --verbosity 2

